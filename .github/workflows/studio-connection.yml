name: Tarkista Studion yhteys ulkoverkosta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tarkista internetyhteys Studioon
        run: node tools/check-studio-connection.mjs
