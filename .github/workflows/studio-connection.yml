name: Tarkista Studion yhteys ulkoverkosta
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tarkista internetyhteys Studioon
        run: node tools/check-studio-connection.mjs
      - name: Tarkista muokkausoikeuksien suojaus
        run: node tools/check-studio-security.mjs
